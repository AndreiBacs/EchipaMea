asyncapi: 3.0.0
info:
  title: EchipaMea WebSocket Contracts (Draft)
  version: 0.2.0
  description: |
    Realtime contracts as implemented by the NestJS backend (`server/src/realtime`).

    Transport is **raw RFC-6455**, not socket.io and not Nest's default
    `{event, data}` envelope. Every frame in both directions is a flat JSON
    object discriminated by a top-level `type` field; `TypeFieldWsAdapter`
    dispatches on it.

    Authentication happens during the upgrade, via one of:
      - `?ticket=` -- a single-use ticket from `POST /realtime/tickets`. The
        intended path, and the only one available to Flutter web, where Dart
        cannot set headers on a WebSocket.
      - `Authorization: Bearer` -- native clients and tests.
      - `?token=` -- the access token in the query string. Refused unless
        `REALTIME_ACCESS_TOKEN_IN_QUERY` is on; it leaks into access logs.
      - nothing at all -- accepted only while `REALTIME_ALLOW_ANONYMOUS` is on,
        for the un-rewired Flutter client, and attributed to
        `DEFAULT_COMPANY_ID`.

    A failed handshake gets an `error` frame and then a close in the 4000 range.
    Once a connection is established the server never closes it over a bad
    message: a rejected frame is answered with an `error` frame and the socket
    stays open, because both Flutter sockets listen with `cancelOnError: true`
    and have no reconnect logic.

servers:
  production:
    host: api.echipamea.example.com
    protocol: wss
    description: Example production websocket host
    security:
      - $ref: '#/components/securitySchemes/realtimeTicket'
  local:
    host: localhost:3000
    protocol: ws
    description: Local development

channels:
  workerTelemetry:
    address: /ws/worker-telemetry
    description: |
      Worker sends periodic location telemetry. Send-only; the worker app ignores
      inbound frames. Worker role only -- a foreman token is closed with 4403.
    messages:
      workerLocation:
        $ref: '#/components/messages/WorkerLocationMessage'
      connected:
        $ref: '#/components/messages/ConnectedMessage'
      ack:
        $ref: '#/components/messages/AckMessage'
      error:
        $ref: '#/components/messages/ErrorMessage'

  foremanNotifications:
    address: /ws/foreman-notifications
    description: |
      Asymmetric by role.

      Foremen join `company:<companyId>:foremen` and are **receive-only**: an
      inbound frame is answered with an `error` frame carrying
      `SEND_NOT_ALLOWED`, never a close.

      Workers join no room and may send exactly one type,
      `worker_report_submitted` -- the one-shot notice the app publishes after a
      successful upload (connect, write, close, in milliseconds). It is deduped
      against the HTTP upload on
      `sha256(companyId|phaseId|employeeId|submittedAtRaw)`, so the normal case
      is a no-op that answers `ack` with `duplicate: true`.
    messages:
      workerReportSubmitted:
        $ref: '#/components/messages/WorkerReportSubmittedMessage'
      connected:
        $ref: '#/components/messages/ConnectedMessage'
      ack:
        $ref: '#/components/messages/AckMessage'
      error:
        $ref: '#/components/messages/ErrorMessage'

operations:
  sendWorkerLocation:
    action: send
    channel:
      $ref: '#/channels/workerTelemetry'
    summary: Worker publishes a location fix.
    messages:
      - $ref: '#/channels/workerTelemetry/messages/workerLocation'
    reply:
      channel:
        $ref: '#/channels/workerTelemetry'
      messages:
        - $ref: '#/channels/workerTelemetry/messages/ack'
        - $ref: '#/channels/workerTelemetry/messages/error'

  receiveWorkerReportSubmitted:
    action: receive
    channel:
      $ref: '#/channels/foremanNotifications'
    summary: Foreman client receives a report-submitted notification.
    messages:
      - $ref: '#/channels/foremanNotifications/messages/workerReportSubmitted'

  publishWorkerReportSubmitted:
    action: send
    channel:
      $ref: '#/channels/foremanNotifications'
    summary: |
      Worker device announces an upload it already completed over HTTP.
      Best-effort and normally redundant; deduped server-side.
    messages:
      - $ref: '#/channels/foremanNotifications/messages/workerReportSubmitted'
    reply:
      channel:
        $ref: '#/channels/foremanNotifications'
      messages:
        - $ref: '#/channels/foremanNotifications/messages/ack'
        - $ref: '#/channels/foremanNotifications/messages/error'

components:
  securitySchemes:
    realtimeTicket:
      type: httpApiKey
      in: query
      name: ticket
      description: Single-use ticket from `POST /realtime/tickets`, valid for 60 seconds.

  messages:
    WorkerLocationMessage:
      name: WorkerLocationMessage
      title: Worker Location Event
      summary: Telemetry update from a worker device.
      payload:
        $ref: '#/components/schemas/WorkerLocationPayload'

    WorkerReportSubmittedMessage:
      name: WorkerReportSubmittedMessage
      title: Worker Report Submitted Event
      summary: Published when a worker report upload succeeds.
      payload:
        $ref: '#/components/schemas/WorkerReportSubmittedPayload'

    ConnectedMessage:
      name: ConnectedMessage
      title: Connection Established
      summary: First frame after a successful handshake.
      payload:
        $ref: '#/components/schemas/ConnectedPayload'

    AckMessage:
      name: AckMessage
      title: Frame Acknowledged
      payload:
        $ref: '#/components/schemas/AckPayload'

    ErrorMessage:
      name: ErrorMessage
      title: Frame Rejected
      summary: A rejected frame. Does not close the connection.
      payload:
        $ref: '#/components/schemas/ErrorPayload'

  schemas:
    WorkerLocationPayload:
      type: object
      required:
        - type
        - latitude
        - longitude
      properties:
        type:
          type: string
          const: worker_location
        employeeId:
          type: string
          description: |
            Ignored when the connection carries a worker token -- the token's
            subject is authoritative, and a mismatch is logged. Only consulted
            for anonymous legacy traffic, which cannot prove who it is.
        employeeName:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
          default: 0
          description: Defaults to 0 rather than rejecting; some devices omit it.
        capturedAt:
          type: string
          format: date-time
          description: |
            UTC ISO-8601. This is the client's send-time wall clock, not the GPS
            fix time. Six fractional digits on mobile, three on web; both are
            accepted. Defaults to server time when absent.

    WorkerReportSubmittedPayload:
      type: object
      required:
        - type
        - projectId
        - phaseId
        - submittedAt
      properties:
        type:
          type: string
          const: worker_report_submitted
        projectId:
          type: string
        projectName:
          type: string
          default: ''
        phaseId:
          type: string
        phaseName:
          type: string
          default: ''
        employeeId:
          type: string
          description: Required from an anonymous sender; taken from the token otherwise.
        employeeName:
          type: string
          default: ''
        description:
          type: string
          default: ''
        photoCount:
          type: integer
          minimum: 0
          default: 0
        hasVoiceMemo:
          type: boolean
          default: false
        submittedAt:
          type: string
          format: date-time
          description: |
            UTC ISO-8601, retained **verbatim**. It is hashed into the
            idempotency key, and Dart emits six fractional digits on mobile
            where JavaScript `Date` holds three -- re-serialising it would
            produce a second key for one report.

    ConnectedPayload:
      type: object
      required: [type, channel, role, serverTime, heartbeatIntervalMs]
      properties:
        type:
          type: string
          const: connected
        channel:
          type: string
          enum: [workerTelemetry, foremanNotifications]
        role:
          type: string
          enum: [admin, foreman, worker]
        serverTime:
          type: string
          format: date-time
        heartbeatIntervalMs:
          type: integer
          description: How often the server pings. Unanswered pings are reaped.

    AckPayload:
      type: object
      required: [type, of, receivedAt]
      properties:
        type:
          type: string
          const: ack
        of:
          type: string
          description: The `type` of the frame being acknowledged.
        receivedAt:
          type: string
          format: date-time
        duplicate:
          type: boolean
          description: True when the server already knew about this event.

    ErrorPayload:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          const: error
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - TICKET_NOT_FOUND
            - TICKET_EXPIRED
            - TICKET_ALREADY_REDEEMED
            - ACCOUNT_DISABLED
            - NOT_AUTHENTICATED_YET
            - SEND_NOT_ALLOWED
            - UNKNOWN_MESSAGE_TYPE
            - MALFORMED_FRAME
            - VALIDATION_FAILED
            - NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string

  # Close codes, for reference. 4000-4999 is the application range.
  #   4401 UNAUTHENTICATED -- handshake failed; a new ticket is needed
  #   4403 FORBIDDEN       -- authenticated, but wrong role for this channel
  #   1001 GOING_AWAY      -- graceful server shutdown
