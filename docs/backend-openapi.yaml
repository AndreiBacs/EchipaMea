          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Submit a phase for review
      tags:
        - Phases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employeeId:
                  type: string
                  minLength: 1
              additionalProperties: false
  /projects/{projectId}/phases/reorder:
    post:
      description: "Requires the full permutation: every phase id exactly once."
      operationId: reorderProjectPhases
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectPhaseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Reorder phases
      tags:
        - Phases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phaseIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
              required:
                - phaseIds
              additionalProperties: false
  /projects/{projectId}/reopen:
    post:
      operationId: reopenProject
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Clear the done override
      tags:
        - Projects
  /projects/{projectId}/workers/{workerId}/sequence:
    get:
      description: "Never 404s for a missing manual order: it returns the computed suggestion with `isManual: false`. 404 means the project or worker does not exist. `suggestedPhaseIds` is always populated alongside the effective order."
      operationId: getWorkerDailySequence
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: workerId
          required: true
          in: path
          schema:
            type: string
        - name: day
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyWorkerSequenceDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: A worker sequence for one project and day
      tags:
        - Sequences
    put:
      description: PUT because this genuinely replaces the whole ordering. Ids must belong to the project but need not match the suggestion -- a foreman may schedule a phase whose date window does not cover the day.
      operationId: saveWorkerDailySequence
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: workerId
          required: true
          in: path
          schema:
            type: string
        - name: day
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyWorkerSequenceDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Save a manual order for a day
      tags:
        - Sequences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderedPhaseIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
              required:
                - orderedPhaseIds
              additionalProperties: false
    delete:
      description: "Idempotent: 204 even when no override existed."
      operationId: resetWorkerDailySequence
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: workerId
          required: true
          in: path
          schema:
            type: string
        - name: day
          required: true
          in: query
          schema:
            type: string
      responses:
        "204":
          description: Reset.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Drop the manual order and fall back to the suggestion
      tags:
        - Sequences
  /realtime/tickets:
    post:
      description: "Returns a short-lived ticket to pass as `?ticket=` when opening a channel, plus the channel paths. Single-use: fetch a new one per connection attempt, including reconnects. Exists because Dart cannot set headers on a WebSocket from Flutter web."
      operationId: createRealtimeTicket
      parameters: []
      responses:
        "201":
          description: Ticket minted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Mint a single-use ticket for a WebSocket handshake
      tags:
        - Realtime
  /sequences:
    get:
      description: One request replaces the per-employee-per-project fan-out the foreman dashboard would otherwise perform. Includes a phaseId -> name map so callers need not refetch projects.
      operationId: listDaySequences
      parameters:
        - name: day
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaySequencesDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Every worker sequence in the company for one day
      tags:
        - Sequences
  /telemetry/latest:
    get:
      description: "One row per employee, most recent first by age. `ageSeconds` is usually large and that is normal: the app samples every 30 minutes and only inside the working window."
      operationId: listLatestLocations
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestLocationsDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Where each employee was last seen
      tags:
        - Telemetry
  /telemetry/locations:
    get:
      description: Defaults to the last 24 hours when no window is given, rather than scanning the whole retention period. Newest first.
      operationId: listLocationSamples
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - name: to
          required: false
          in: query
          schema:
            type: string
            format: date-time
        - name: from
          required: false
          in: query
          schema:
            type: string
            format: date-time
        - name: employeeId
          required: false
          in: query
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationTrailDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Location trail for a time window
      tags:
        - Telemetry
  /worker/arrivals:
    post:
      description: "Notifies every foreman in the company, by stored notification and by socket. Repeat taps within 15 minutes return the first arrival with `duplicate: true` rather than putting a second row in front of the foreman."
      operationId: announceWorkerArrival
      parameters: []
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerArrivalDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Announce arrival on site
      tags:
        - Worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  minLength: 1
                arrivedAt:
                  type: string
              required:
                - projectId
              additionalProperties: false
  /worker/locations:
    post:
      description: "The catch-up path for fixes captured while the telemetry socket was down. Safe to retry: samples whose `capturedAt` is already stored are counted as duplicates rather than written twice. Batches over 500 samples are rejected, not truncated."
      operationId: recordWorkerLocations
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationBatchResultDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Batch location upload (offline outbox flush)
      tags:
        - Worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                samples:
                  type: array
                  items:
                    type: object
                    properties:
                      latitude:
                        type: number
                        minimum: -90
                        maximum: 90
                      longitude:
                        type: number
                        minimum: -180
                        maximum: 180
                      accuracyMeters:
                        type: number
                        minimum: 0
                        default: 0
                      capturedAt:
                        type: string
                    required:
                      - latitude
                      - longitude
                      - capturedAt
                    additionalProperties: false
                  minItems: 1
                  maxItems: 500
              required:
                - samples
              additionalProperties: false
  /worker/login-tickets/redeem:
    post:
      description: Public. Accepts either a bare `ticketId` or the raw scanned `payload` (JSON, or a URL carrying it in `?payload=` plain or base64). Returns 404 for an unknown code, 409 TICKET_ALREADY_REDEEMED for a reused one, 410 TICKET_EXPIRED for a stale one.
      operationId: redeemWorkerLoginTicket
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerSessionResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Exchange a scanned QR ticket for a worker session
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketId:
                  type: string
                  minLength: 1
                payload:
                  type: string
                  minLength: 1
                deviceId:
                  type: string
                  maxLength: 200
              additionalProperties: false
      security: []
  /worker/me:
    get:
      description: Includes the working-days and working-hours window that gates location telemetry. The app reads those from the foreman roster today, which means every worker phone holds the whole company's employee list.
      operationId: getWorkerProfile
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfileDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: The signed-in worker's own profile
      tags:
        - Worker
  /worker/projects:
    get:
      description: "Assigned at project level or to any of its live phases. Finished projects are omitted unless `includeDone=true`, and the list is ordered inProgress, planned, done, then by name -- matching the app. Returned whole rather than cursor-paginated: both the filter and the sort key are derived from phases, so no SQL cursor can express the boundary."
      operationId: listWorkerProjects
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: includeDone
          required: false
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProjectsDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Projects assigned to the signed-in worker
      tags:
        - Worker
  /worker/projects/{projectId}:
    get:
      description: Answers 404 for a project that exists but is not assigned to this worker, so the endpoint cannot be used to enumerate the company.
      operationId: getWorkerProject
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: One assigned project, with its phases and work instructions
      tags:
        - Worker
  /worker/reports:
    post:
      description: "Matches the existing Flutter multipart upload exactly: text fields projectId, projectName, phaseId, phaseName, employeeId, employeeName, description, submittedAt, plus indexed photoNames[i]; file parts `photos[]` (repeated) and optional `voiceMemo`. All parts arrive as application/octet-stream, so types are sniffed from the bytes. Idempotent on (company, phase, employee, submittedAt): a retry returns the original result rather than creating a second report."
      operationId: submitWorkerReport
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - projectId
                - phaseId
                - submittedAt
              properties:
                projectId:
                  type: string
                projectName:
                  type: string
                phaseId:
                  type: string
                phaseName:
                  type: string
                employeeId:
                  type: string
                employeeName:
                  type: string
                description:
                  type: string
                submittedAt:
                  type: string
                  description: ISO-8601 UTC. Six fractional digits on mobile, three on web; both accepted and the raw string is retained for idempotency.
                photos[]:
                  type: array
                  items:
                    type: string
                    format: binary
                voiceMemo:
                  type: string
                  format: binary
                photoNames[0]:
                  type: string
      responses:
        "201":
          description: Report stored.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: Submit an end-of-day report for a phase
      tags:
        - Worker Reports
  /workers/{workerId}/sequence:
    get:
      operationId: getWorkerDaySchedule
      parameters:
        - name: workerId
          required: true
          in: path
          schema:
            type: string
        - name: day
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaySequencesDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      summary: One worker day across every project
      tags:
        - Sequences
info:
  title: EchipaMea API
  description: |-
    Generated from the server code by `npm run spec:generate`; do not edit by hand. `npm run spec:check` fails CI when this file is out of date.

    Every route except those marked `security: []` requires `Authorization: Bearer <token>`, where the token names a company. Errors use one envelope: `{ error: { code, message, field? }, traceId? }`. Realtime channels are described in `websockets-asyncapi-draft.yaml`.
  version: 0.2.0
  contact: {}
tags:
  - name: Auth
  - name: Clients
  - name: Company
  - name: Employees
  - name: Health
  - name: Media
  - name: Notifications
  - name: Phases
  - name: Projects
  - name: Realtime
  - name: Sequences
  - name: Telemetry
  - name: Worker
  - name: Worker Reports
servers:
  - url: http://localhost:3000
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ArrivalDto:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        arrivedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - employeeId
        - arrivedAt
    ArrivalsDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArrivalDto"
        page:
          type: object
      required:
        - items
        - page
    ClientDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        activeProjects:
          type: number
          description: "Derived: count of this client's projects whose status is not `done`."
          readOnly: true
        type:
          type: string
          enum:
            - individual
            - company
            - publicInstitution
        status:
          type: string
          enum:
            - active
            - inactive
            - blocked
        preferredContactMethod:
          type: string
          enum:
            - phone
            - email
            - whatsApp
        notes:
          type: string
        email:
          type: string
        phone:
          type: string
        addressLine1:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        contactPerson:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - activeProjects
        - type
        - status
        - preferredContactMethod
        - notes
        - email
        - phone
        - addressLine1
        - city
        - state
        - zipCode
        - contactPerson
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        addressLine1:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        addressLine:
          type: string
          description: "Derived: the address parts joined for display. The app currently stores the address as one free-text field, so this is what it binds to until that form is split."
        iban:
          type: string
        cui:
          type: string
          description: Romanian fiscal code (CUI).
        vatNumber:
          type: string
        regCom:
          type: string
          description: Romanian trade register number (Nr. Reg. Com.).
      required:
        - id
        - name
        - addressLine1
        - city
        - state
        - zipCode
        - addressLine
        - iban
        - cui
        - vatNumber
        - regCom
    CurrentPrincipalDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - foreman
            - admin
            - worker
        companyId:
          type: string
        userId:
          type: string
        employeeId:
          type: string
        email:
          type: string
        displayName:
          type: string
      required:
        - role
        - companyId
        - displayName
    DailyWorkerSequenceDto:
      type: object
      properties:
        projectId:
          type: string
        dayKey:
          type: string
          example: 2026-04-14
        workerId:
          type: string
        orderedPhaseIds:
          description: "The effective order: the manual override when one exists, else the suggestion."
          type: array
          items:
            type: string
        suggestedPhaseIds:
          description: What the server would suggest for this day, always present. Returned alongside the effective order so the planner can show "n suggested" without a second request.
          type: array
          items:
            type: string
        isManual:
          type: boolean
          description: True when a foreman has saved an explicit order for this day.
      required:
        - projectId
        - dayKey
        - workerId
        - orderedPhaseIds
        - suggestedPhaseIds
        - isManual
    DaySequencesDto:
      type: object
      properties:
        dayKey:
          type: string
          example: 2026-04-14
        sequences:
          type: array
          items:
            $ref: "#/components/schemas/DailyWorkerSequenceDto"
        phaseNames:
          type: object
          description: Phase id -> phase name, so callers can render without refetching projects.
      required:
        - dayKey
        - sequences
    EmployeeDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - electrician
            - plumber
            - generalWorker
            - carpenter
            - welder
            - helper
            - painter
            - mason
            - hvacTechnician
        email:
          type: string
        phone:
          type: string
        workStartHour:
          type: number
          minimum: 0
          maximum: 23
        workEndHour:
          type: number
          minimum: 0
          maximum: 23
        workingDays:
          description: ISO-8601 weekdays, 1=Mon .. 7=Sun. Gates worker location telemetry.
          type: array
          items:
            type: number
        latitude:
          type: object
          nullable: true
        longitude:
          type: object
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - role
        - email
        - phone
        - workStartHour
        - workEndHour
        - workingDays
        - isActive
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - ACCOUNT_DISABLED
                - CLIENT_HAS_PROJECTS
                - CONFLICT
                - CROSS_TENANT
                - DUPLICATE_REPORT
                - FORBIDDEN
                - INTERNAL_ERROR
                - INVALID_CREDENTIALS
                - MALFORMED_FRAME
                - MEDIA_IN_USE
                - NOT_AUTHENTICATED_YET
                - NOT_FOUND
                - PAYLOAD_TOO_LARGE
                - PHASE_INVALID_TRANSITION
                - RATE_LIMITED
                - SEND_NOT_ALLOWED
                - SEQUENCE_PHASE_MISMATCH
                - TICKET_ALREADY_REDEEMED
                - TICKET_EXPIRED
                - TICKET_MALFORMED
                - TICKET_NOT_FOUND
                - TOKEN_EXPIRED
                - TOKEN_INVALID
                - TOKEN_REUSED
                - UNAUTHENTICATED
                - UNKNOWN_MESSAGE_TYPE
                - UNSUPPORTED_MEDIA_TYPE
                - VALIDATION_FAILED
            message:
              type: string
            field:
              type: string
              description: Dotted path of the offending input, for validation errors.
        traceId:
          type: string
          description: Also sent as the `x-trace-id` response header.
    ForemanProfileDto:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - foreman
            - admin
        fullName:
          type: string
        phone:
          type: string
        jobTitle:
          type: string
        companyId:
          type: string
        companyName:
          type: string
      required:
        - userId
        - email
        - role
        - fullName
        - phone
        - jobTitle
        - companyId
        - companyName
    LatestLocationDto:
      type: object
      properties:
        employeeId:
          type: string
        employeeName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        accuracyMeters:
          type: number
        capturedAt:
          type: string
          format: date-time
          description: The device's own clock. Untrusted -- see clockSkewSeconds.
        receivedAt:
          type: string
          format: date-time
          description: Server-assigned. This is what "last seen" is ordered by, so a device with a wrong clock cannot pin itself to the top of the list.
        ageSeconds:
          type: number
          description: Seconds since the server received the fix. The app samples every 30 minutes and only inside working hours, so a large value is normal and does not mean the worker is missing.
        clockSkewSeconds:
          type: number
          description: capturedAt minus receivedAt. Near zero for a healthy device; a large magnitude means the phone's clock is wrong, which is worth surfacing rather than silently correcting.
      required:
        - employeeId
        - employeeName
        - latitude
        - longitude
        - accuracyMeters
        - capturedAt
        - receivedAt
        - ageSeconds
        - clockSkewSeconds
    LatestLocationsDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LatestLocationDto"
      required:
        - items
    LocationBatchResultDto:
      type: object
      properties:
        accepted:
          type: number
          description: Samples written.
        duplicates:
          type: number
          description: Samples skipped as already stored. The client may resend a batch it never saw acknowledged, so this is expected rather than an error.
      required:
        - accepted
        - duplicates
    LocationSampleDto:
      type: object
      properties:
        employeeId:
          type: string
        employeeName:
          type: string
          description: Name at the time of the fix, not the current one.
        latitude:
          type: number
        longitude:
          type: number
        accuracyMeters:
          type: number
        capturedAt:
          type: string
          format: date-time
          description: The device's send-time wall clock, not the GPS fix time.
        receivedAt:
          type: string
          format: date-time
          description: When the server stored it.
      required:
        - employeeId
        - employeeName
        - latitude
        - longitude
        - accuracyMeters
        - capturedAt
        - receivedAt
    LocationTrailDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LocationSampleDto"
        page:
          type: object
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
        - items
        - page
        - from
        - to
    LoginResponseDto:
      type: object
      properties:
        token:
          type: string
          deprecated: true
          description: Alias of `accessToken`. Emitted because the current Flutter client reads `token ?? accessToken`. Will be removed once the client is rewired.
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Access-token lifetime in seconds.
        refreshToken:
          type: string
          description: Opaque rotating refresh token.
        refreshExpiresIn:
          type: number
          description: Refresh-token lifetime in seconds.
        user:
          $ref: "#/components/schemas/LoginUserDto"
      required:
        - token
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
        - refreshExpiresIn
        - user
    LoginUserDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - foreman
            - admin
        companyId:
          type: string
        fullName:
          type: string
      required:
        - id
        - email
        - role
        - companyId
        - fullName
    MarkAllReadResultDto:
      type: object
      properties:
        updated:
          type: number
          description: Rows this call changed. Zero when nothing was unread.
        unreadCount:
          type: number
          description: Always 0; returned so the client can set state without refetching.
      required:
        - updated
        - unreadCount
    NotificationDto:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - workerReportSubmitted
            - phaseApproved
            - phaseRejected
            - workerArrived
        payload:
          type: object
          additionalProperties: true
          description: "Kind-specific fields: projectName, phaseName, employeeName, photoCount, hasVoiceMemo. Snapshots taken when the event happened, so a later rename does not rewrite history."
        projectId:
          type: object
          nullable: true
        phaseId:
          type: object
          nullable: true
        employeeId:
          type: object
          nullable: true
        reportId:
          type: object
          nullable: true
        occurredAt:
          type: string
          format: date-time
          description: When the event happened.
        createdAt:
          type: string
          format: date-time
          description: When this row was created.
        readAt:
          type: object
          nullable: true
          format: date-time
      required:
        - id
        - kind
        - payload
        - occurredAt
        - createdAt
    PagedClientsDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientDto"
        page:
          type: object
      required:
        - items
        - page
    PagedEmployeesDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeDto"
        page:
          type: object
      required:
        - items
        - page
    PagedNotificationsDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDto"
        page:
          type: object
        unreadCount:
          type: number
          description: Unread count for this recipient across all notifications, not just this page. Included here so the badge does not need a second request on every app start.
      required:
        - items
        - page
        - unreadCount
    PagedProjectsDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDto"
        page:
          type: object
      required:
        - items
        - page
    PhaseReportSummaryDto:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        description:
          type: string
        submittedAt:
          type: string
          format: date-time
        photoCount:
          type: number
        hasVoiceMemo:
          type: boolean
        photoUrls:
          type: array
          items:
            type: string
        voiceMemoUrl:
          type: object
          nullable: true
      required:
        - id
        - employeeId
        - employeeName
        - description
        - submittedAt
        - photoCount
        - hasVoiceMemo
    PhaseWorkInstructionDto:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        photos:
          type: array
          items:
            $ref: "#/components/schemas/WorkInstructionMediaDto"
        audio:
          type: array
          items:
            $ref: "#/components/schemas/WorkInstructionMediaDto"
      required:
        - id
        - text
        - photos
        - audio
    ProjectDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        clientId:
          type: string
        status:
          type: string
          enum:
            - planned
            - inProgress
            - done
          readOnly: true
          description: Derived from the phases, or forced to `done` by POST /projects/{id}/done. Never stored.
        workers:
          readOnly: true
          description: "Derived: names of the assigned employees. Send assignedEmployeeIds to change it."
          type: array
          items:
            type: string
        assignedEmployeeIds:
          type: array
          items:
            type: string
        useClientAddress:
          type: boolean
        addressLine1:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        latitude:
          type: object
          nullable: true
        longitude:
          type: object
          nullable: true
        closedAt:
          type: object
          format: date-time
          nullable: true
          readOnly: true
        phases:
          type: array
          items:
            $ref: "#/components/schemas/ProjectPhaseDto"
      required:
        - id
        - name
        - clientId
        - status
        - workers
        - assignedEmployeeIds
        - useClientAddress
        - addressLine1
        - city
        - state
        - zipCode
        - phases
    ProjectPhaseDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          example: 2026-04-13
          description: Calendar date, YYYY-MM-DD.
        endDate:
          type: string
          example: 2026-04-16
        description:
          type: string
        status:
          type: string
          enum:
            - notStarted
            - inProgress
            - pendingReview
            - done
        assignedEmployeeIds:
          type: array
          items:
            type: string
        submittedAt:
          type: object
          format: date-time
          nullable: true
          readOnly: true
        submittedByEmployeeIds:
          readOnly: true
          type: array
          items:
            type: string
        reviewedAt:
          type: object
          format: date-time
          nullable: true
          readOnly: true
        reviewedByForemanId:
          type: object
          nullable: true
          readOnly: true
        reviewNotes:
          type: object
          nullable: true
          readOnly: true
        workInstructions:
          type: array
          items:
            $ref: "#/components/schemas/PhaseWorkInstructionDto"
      required:
        - id
        - name
        - startDate
        - endDate
        - description
        - status
        - assignedEmployeeIds
        - submittedByEmployeeIds
        - workInstructions
    UnreadCountDto:
      type: object
      properties:
        unreadCount:
          type: number
      required:
        - unreadCount
    WorkerArrivalDto:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        employeeId:
          type: string
        arrivedAt:
          type: string
          format: date-time
        duplicate:
          type: boolean
          description: True when this matched a recent arrival instead of recording a new one.
      required:
        - id
        - projectId
        - employeeId
        - arrivedAt
        - duplicate
    WorkerIdentityDto:
      type: object
      properties:
        employeeId:
          type: string
        employeeName:
          type: string
        role:
          type: string
          enum:
            - worker
        companyId:
          type: string
      required:
        - employeeId
        - employeeName
        - role
        - companyId
    WorkerLoginTicketDto:
      type: object
      properties:
        ticketId:
          type: string
          description: Opaque single-use secret. Present only in this response.
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        expiresInSeconds:
          type: number
        qrPayload:
          type: string
          description: Render this string verbatim into the QR code. It is byte-for-byte the shape the existing Flutter scanner already parses.
        qrPayloadUrl:
          type: string
          description: Deep link carrying the payload as base64url, when APP_WORKER_LOGIN_URL is set.
      required:
        - ticketId
        - issuedAt
        - expiresAt
        - expiresInSeconds
        - qrPayload
    WorkerProfileDto:
      type: object
      properties:
        employeeId:
          type: string
        name:
          type: string
        role:
          type: string
        email:
          type: string
        phone:
          type: string
        workStartHour:
          type: number
          minimum: 0
          maximum: 23
        workEndHour:
          type: number
          minimum: 0
          maximum: 23
        workingDays:
          description: ISO-8601 weekdays, 1=Mon .. 7=Sun. Gates location telemetry.
          type: array
          items:
            type: number
        latitude:
          type: object
          nullable: true
        longitude:
          type: object
          nullable: true
        companyId:
          type: string
        companyName:
          type: string
      required:
        - employeeId
        - name
        - role
        - email
        - phone
        - workStartHour
        - workEndHour
        - workingDays
        - companyId
        - companyName
    WorkerProjectsDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDto"
        page:
          type: object
      required:
        - items
        - page
    WorkerSessionResponseDto:
      type: object
      properties:
        token:
          type: string
          deprecated: true
          description: Alias of `accessToken`.
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
        refreshToken:
          type: string
        refreshExpiresIn:
          type: number
        worker:
          $ref: "#/components/schemas/WorkerIdentityDto"
      required:
        - token
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
        - refreshExpiresIn
        - worker
    WorkInstructionMediaDto:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          description: Fetch via GET /media/{id}/content or a signed URL.
        contentType:
          type: string
        byteSize:
          type: number
      required:
        - id
        - url
        - contentType
  responses:
    BadRequest:
      description: Validation failed (`VALIDATION_FAILED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated, but the role or account may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "No such resource in the caller’s company. Never 403: that would confirm the id."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limited (`RATE_LIMITED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, expired or revoked token (`UNAUTHENTICATED`, `TOKEN_*`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
security:
  - bearerAuth: []
