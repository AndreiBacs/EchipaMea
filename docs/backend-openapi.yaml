                      - startDate
                      - endDate
                    additionalProperties: false
                  default: []
                status:
                  type: string
                  enum:
                    - planned
                    - inProgress
                    - done
                workers:
                  type: array
                  items:
                    type: string
              required:
                - name
                - clientId
              additionalProperties: false
