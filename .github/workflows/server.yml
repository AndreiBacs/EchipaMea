name: Server

on:
  push:
    branches: ['main']
    paths:
      - 'server/**'
      - 'docs/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'server/**'
      - 'docs/**'
      - '.github/workflows/server.yml'

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: echipamea
          POSTGRES_PASSWORD: echipamea
          POSTGRES_DB: echipamea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echipamea -d echipamea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The e2e harness only accepts a database whose name ends in "_test".
      TEST_DATABASE_URL: postgresql://echipamea:echipamea@localhost:5432/echipamea_test?schema=public
      # Read by `prisma validate`; nothing in this job connects to it.
      DATABASE_URL: postgresql://echipamea:echipamea@localhost:5432/echipamea_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run prisma:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run test:e2e
      - name: Specs match the code
        run: npm run spec:check
      - name: Docker image builds
        run: docker build -t echipamea-server:ci .
